name: tere_system
description: "Barangay emergency response and community communication platform (Flutter Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  geolocator: ^13.0.1
  image_picker: ^1.1.2
  cross_file: ^0.3.4

  intl: ^0.19.0
  uuid: ^4.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
